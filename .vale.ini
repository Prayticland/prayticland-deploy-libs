StylesPath = styles

MinAlertLevel = suggestion

Packages = Google, Readability

Vocab = Prayticland

# Markdown.
[*.md]
BasedOnStyles = Vale, Google, Readability
Vale.Terms = NO

# Comments in TypeScript sources.
[*.{ts,tsx}]
BasedOnStyles = Vale, Google, Readability
Vale.Terms = NO

# Commit messages: Subject, body, and trailers as separate scopes; Git's
# comment lines are skipped.
[COMMIT_EDITMSG]
BasedOnStyles = Vale, Google, Readability
Vale.Terms = NO
View = Commit
